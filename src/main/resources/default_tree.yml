options:
  display_name: "Votre aventure sur SkyHand"
  description: "&eComplétez les progrès au fur et à mesure de votre aventure sur SkyHand !"
  item: OAK_SAPLING
  minecraft-gui-background: "textures/block/gray_glazed_terracotta.png"

advancements:

  # --- BRANCHE 1 : MINAGE ---
  charbon:
    type: BlockBreak
    value: COAL_ORE
    amount: 1
    rewards:
      message: { type: message, value: "&7&l« &dProgrès &8&l» &7Vous avez miné votre premier minerais de charbon ! Le générateur de votre île peut générer de la pierre, du charbon et du fer." }
    display:
      name: "Pas que de la pierre ?"
      item: COAL_ORE
      description: "Minez un minerai de charbon."
      x: 1
      y: 1.5
      minecraft-gui-frame: GOAL
      minecraft-toast: true

  fer_charbon:
    type: BlockBreak
    value: COAL_ORE,IRON_ORE
    amount: 500
    requirements:
      parent: { type: advancement, value: "tree.charbon" }
    rewards:
      message: { type: message, value: "&7&l« &dProgrès &8&l» &7Vous avez miné 500 minerais de charbon/fer, le générateur à l'air de vous plaire !" }
    display:
      name: "Réserve de Minerais"
      item: IRON_ORE
      description: "Minez 500 minerais de fer ou de charbon."
      x: 2
      y: 0.5
      minecraft-gui-frame: TASK
      minecraft-toast: true

  endstone:
    type: BlockBreak
    value: END_STONE
    amount: 1
    requirements:
      parent: { type: advancement, value: "tree.fer_charbon" }
    rewards:
      message: { type: message, value: "&7&l« &dProgrès &8&l» &7Vous avez boosté votre générateur, mais à quel prix ?" }
    display:
      name: "Des minerais ? §5(END)"
      item: END_STONE
      description: "Minez un bloc de pierre de l'end."
      x: 3
      y: 0
      minecraft-gui-frame: TASK
      minecraft-toast: true

  netherracks:
    type: BlockBreak
    value: NETHERRACK
    amount: 1
    requirements:
      parent: { type: advancement, value: "tree.fer_charbon" }
    rewards:
      message: { type: message, value: "&7&l« &dProgrès &8&l» &7Vous avez boosté votre générateur, celui ci ne produira que des blocs du nether pour les 60 prochaines minutes !\n&7&o(C'est vraiment ce que vous voulez ?)" }
    display:
      name: "Des minerais ? §c(NETHER)"
      item: NETHERRACK
      description: "Minez un bloc de netherrack."
      x: 3
      y: 1
      minecraft-gui-frame: TASK
      minecraft-toast: true

  diamant:
    type: BlockBreak
    value: DIAMOND_ORE
    amount: 12
    requirements:
      parent: { type: advancement, value: "tree.charbon" }
    rewards:
      message: { type: message, value: "&7&l« &dProgrès &8&l» &7Qu'allez-vous faire de ces diamants, une pioche ou une armure ? (Une houe ?!)" }
    display:
      name: "Rareté Élevée"
      item: DIAMOND_ORE
      description: "Minez 12 minerais de Diamant."
      x: 2
      y: 1.5
      minecraft-gui-frame: TASK
      minecraft-toast: true

  debris_antique:
    type: BlockBreak
    value: ANCIENT_DEBRIS
    amount: 1
    requirements:
      parent: { type: advancement, value: "tree.diamant" }
    rewards:
      message: { type: message, value: "&7&l« &dProgrès &8&l» &7Ces débris mystérieux sont très rares, prenez-en soin !" }
    display:
      name: "Des minerais ? §9(ANTIQUE)"
      item: ANCIENT_DEBRIS
      description: "Minez un bloc de débris antiques."
      x: 3
      y: 2
      minecraft-gui-frame: TASK
      minecraft-toast: true

  netherite_ingots:
    type: CraftItem
    value: NETHERITE_INGOT
    amount: 1
    requirements:
      parent: { type: advancement, value: "tree.debris_antique" }
    rewards:
      message: { type: message, value: "&7&l« &dProgrès &8&l» &7Il n'y a pas plus solide que la netherite, mais ce n'est pas invincible." }
    display:
      name: "Dureté Absolue"
      item: NETHERITE_INGOT
      description: "Fabriquez un lingot de netherite."
      x: 4
      y: 2
      minecraft-gui-frame: TASK
      minecraft-toast: true

  # --- BRANCHE 2 : SPAWNERS & MOBS ---
  spawners:
    type: BlockPlace
    value: SPAWNER
    amount: 1
    rewards:
      message: { type: message, value: "&7&l« &dProgrès &8&l» &7Vous avez posé votre premier spawner, c'est le début de la richesse ! 1 spawner = 1 mob qui spawn toutes les 30-50 secondes." }
    display:
      name: "Argent Facile !"
      item: SPAWNER
      description: "Posez un spawner sur votre île."
      x: 1
      y: 4
      minecraft-gui-frame: GOAL
      minecraft-toast: true

  killmobs:
    type: killentity
    value: any
    amount: 5000
    requirements:
      parent: { type: advancement, value: "tree.spawners" }
    rewards:
      message: { type: message, value: "&7&l« &dProgrès &8&l» &7Vous avez tué 5000 mobs, c'est un sacré massacre... Mais pour des SHCoins, tout est permis !" }
    display:
      name: "Argent Vraiment si Facile ?"
      item: BONE
      description: "Tuez 5000 mobs."
      x: 2
      y: 4
      minecraft-gui-frame: TASK
      minecraft-toast: true

  killzombies:
    type: killentity
    value: ZOMBIE
    amount: 5000
    requirements:
      parent: { type: advancement, value: "tree.killmobs" }
    rewards:
      message: { type: message, value: "&7&l« &dProgrès &8&l» &75000 zombies tués, je suppose que tu ne t'arrêteras pas à si peu ?" }
    display:
      name: "Tueur de Zombie"
      item: ZOMBIE_SPAWN_EGG
      description: "Tuez 5000 zombies."
      x: 3
      y: 3
      minecraft-gui-frame: TASK
      minecraft-toast: true

  killskeletons:
    type: killentity
    value: SKELETON
    amount: 5000
    requirements:
      parent: { type: advancement, value: "tree.killmobs" }
    rewards:
      message: { type: message, value: "&7&l« &dProgrès &8&l» &75000 squelettes tués, ils l'ont dans l'os !" }
    display:
      name: "Tueur de Squelette"
      item: SKELETON_SPAWN_EGG
      description: "Tuez 5000 squelettes."
      x: 3
      y: 4
      minecraft-gui-frame: TASK
      minecraft-toast: true

  killcreeper:
    type: killentity
    value: CREEPER
    amount: 5000
    requirements:
      parent: { type: advancement, value: "tree.killmobs" }
    rewards:
      message: { type: message, value: "&7&l« &dProgrès &8&l» &75000 creeper tués, ton aventure est explosive !" }
    display:
      name: "Tueur de Creeper"
      item: CREEPER_SPAWN_EGG
      description: "Tuez 5000 creepers."
      x: 3
      y: 5
      minecraft-gui-frame: TASK
      minecraft-toast: true

  # --- BRANCHE 3 : AGRICULTURE ---
  agriculture:
