    display:
      name: "Dévoreur de Baies Sucrées"
      item: SWEET_BERRIES
      description: "Mangez une baie sucrée."
      x: 3
      y: 6.5
      minecraft-gui-frame: TASK
      minecraft-toast: true

  harvestglow_berries:
