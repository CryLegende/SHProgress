    value: GLOW_BERRIES
    amount: 1
    requirements:
      parent: { type: advancement, value: "tree.harvestbeetroot" }
    rewards:
      message: { type: message, value: "&7&l« &dProgrès &8&l» &7Ça brille dans le ventre !" }
    display:
      name: "Dévoreur de Baies Lumineuses"
      item: GLOW_BERRIES
      description: "Mangez une baie lumineuse."
      x: 3
      y: 7.5
      minecraft-gui-frame: TASK
      minecraft-toast: true

  # --- BRANCHE 4 : VOTE ---
  boxordinaire1:
    type: impossible
    value: none
    amount: 1
    rewards:
      message: { type: message, value: "&7&l« &dProgrès &8&l» &7La box ordinaire permet de progresser plus rapidement, votez pour gagner un maximum de clés pour rouvrir la box ordinaire !" }
